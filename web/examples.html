<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>md2pdf · 示例库</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/examples.css">
  <script src="/examples.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-icon" aria-hidden="true">M↓</span><div><h1>md2pdf</h1><p>示例库</p></div></div>
    <nav class="topbar-actions" aria-label="页面导航">
      <a class="ghost-link" href="/">← 返回编辑器</a>
      <a class="button-link" href="https://github.com/jiyeqian/md2pdf" target="_blank" rel="noopener noreferrer" aria-label="md2pdf GitHub 仓库">GitHub</a>
    </nav>
  </header>
  <main class="examples-main">
    <p class="examples-intro">按文档类型整理的在线样例。浏览与预览不会改动编辑器中的草稿；点击「使用此示例」才会把源码交接回编辑器。</p>
    <div class="examples-layout">
      <section class="examples-list-panel" aria-label="示例列表">
        <div class="panel-heading"><h2>示例</h2><span id="list-status" role="status" aria-live="polite">正在加载…</span></div>
        <ul id="example-list" class="example-cards" role="list" aria-busy="true"></ul>
      </section>
      <section class="examples-detail-panel" aria-label="示例详情">
        <div class="detail-head">
          <div class="detail-title-block">
            <h2 id="detail-title">选择一个示例</h2>
            <p id="detail-meta" class="detail-meta"></p>
          </div>
          <button id="use-example" class="primary" type="button" disabled>使用此示例</button>
        </div>
        <div class="detail-body">
          <div class="detail-source">
            <div class="panel-heading"><h3>Markdown 源码（只读）</h3><span id="source-type" class="type-badge"></span></div>
            <label class="sr-only" for="example-source">示例 Markdown 源码（只读）</label>
            <textarea id="example-source" readonly spellcheck="false" placeholder="选择左侧示例以查看源码…"></textarea>
          </div>
          <div class="detail-preview">
            <div class="panel-heading"><h3>排版预览</h3><span id="preview-state" class="detail-meta">选择示例后在此预览。</span></div>
            <div class="preview-surface"><iframe id="example-preview" title="示例排版预览" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe><div id="example-empty">选择示例后在此预览。</div></div>
          </div>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
