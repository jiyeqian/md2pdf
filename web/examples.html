<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>make md2pdf great · 模板库</title>
  <link rel="stylesheet" href="/examples.css">
  <script src="/template-confirm.js" defer></script>
  <script src="/examples.js" defer></script>
</head>
<body class="template-library-page" hidden>
  <header class="topbar">
    <div class="brand"><a class="brand-icon" href="/" data-view-link="editor" aria-label="返回编辑器" title="返回编辑器">M↓</a><div><h1>md2pdf</h1><p>模板库</p></div></div>
    <p class="topbar-tagline">MAKE MD2PDF GREAT</p>
    <nav class="topbar-actions" aria-label="页面导航">
      <a class="ghost-link nav-square" href="/" aria-label="返回编辑器" title="返回编辑器"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H5v18h14V9zM14 3v6h5M8 13h8M8 17h6"/></svg></a>
      <a class="button-link nav-square" href="https://github.com/jiyeqian/md2pdf" target="_blank" rel="noopener noreferrer" aria-label="md2pdf GitHub 仓库" title="GitHub"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-4 1-4-2-6-2M16 22v-3.5c0-1-.3-1.7-.8-2.1 2.7-.3 5.5-1.3 5.5-6A4.6 4.6 0 0 0 19.5 7c.1-.4.5-1.9-.1-3.4 0 0-1-.3-3.5 1.3a12 12 0 0 0-6.4 0C7 3.3 6 3.6 6 3.6 5.4 5.1 5.8 6.6 5.9 7a4.6 4.6 0 0 0-1.2 3.4c0 4.7 2.8 5.7 5.5 6-.4.4-.7 1-.7 2.1V22"/></svg></a>
    </nav>
  </header>
  <div data-view="templates" class="template-library-view">
  <main class="examples-main">
    <p class="examples-intro">浏览模板排版效果；从模板创建会替换当前文档，系统会先请你确认。</p>
    <div class="examples-layout">
      <section class="examples-list-panel" aria-label="示例列表">
        <div class="panel-heading"><h2>模板 <button id="template-list-back" type="button" hidden>返回列表</button></h2><span id="list-status" role="status" aria-live="polite">正在加载…</span></div>
        <div class="template-browser-tools"><input id="template-search" type="search" placeholder="搜索模板" aria-label="搜索模板"><ul id="example-list" class="example-cards" role="list" aria-busy="true"></ul></div>
      </section>
      <section class="examples-detail-panel" aria-label="示例详情">
        <div class="detail-head">
          <div class="detail-title-block">
            <h2 id="detail-title">选择一个示例</h2>
            <p id="detail-meta" class="detail-meta"></p>
          </div>
          <button id="use-example" class="primary" type="button" disabled>从模板创建</button>
        </div>
        <div class="detail-body">
          <details class="detail-source">
            <summary>查看模板源码</summary>
            <div class="panel-heading"><h3>Markdown 源码（只读）</h3><span id="source-type" class="type-badge"></span></div>
            <label class="sr-only" for="example-source">示例 Markdown 源码（只读）</label>
            <textarea id="example-source" readonly spellcheck="false" placeholder="选择左侧示例以查看源码…"></textarea>
          </details>
          <div class="detail-preview">
            <div class="panel-heading"><h3>排版预览</h3><span id="preview-state" class="detail-meta">选择示例后在此预览。</span></div>
            <div class="preview-surface"><iframe id="example-preview" title="示例排版预览" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe><div id="example-empty">选择示例后在此预览。</div></div>
          </div>
        </div>
      </section>
    </div>
  </main>
  </div>
</body>
</html>
