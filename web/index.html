<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>make md2pdf great</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/editor-core.css">
  <link rel="stylesheet" href="/editor-images.css">
  <link rel="stylesheet" href="/editor-pro.css">
  <link rel="stylesheet" href="/editor-workspace.css">
  <link rel="stylesheet" href="/editor-doi.css">
  <link rel="stylesheet" href="/examples.css">
  <script src="/editor-vendor.js" defer></script>
  <script src="/editor-core.js" defer></script>
  <script src="/editor-images.js" defer></script>
  <script src="/editor-pro.js" type="module"></script>
  <script src="/editor-workspace.js" defer></script>
  <script src="/editor-doi.js" type="module"></script>
  <script src="/template-confirm.js" defer></script>
  <script src="/examples.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar" id="app-topbar">
    <div class="brand"><a class="brand-icon" href="/" aria-label="返回编辑器" title="返回编辑器">M↓</a><div class="brand-text"><h1 class="brand-logo">md2pdf</h1><p class="brand-sub" id="app-view-label">编辑器</p></div></div>
    <p class="topbar-tagline">MAKE MD2PDF GREAT</p>
    <nav class="topbar-actions" aria-label="页面导航">
      <a id="examples-link-top" class="button-link nav-square" href="/" aria-label="模板库" title="模板库" data-view-link="templates"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></a>
      <a class="button-link nav-square" href="https://github.com/jiyeqian/md2pdf" target="_blank" rel="noopener noreferrer" aria-label="md2pdf GitHub 仓库" title="GitHub"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-4 1-4-2-6-2M16 22v-3.5c0-1-.3-1.7-.8-2.1 2.7-.3 5.5-1.3 5.5-6A4.6 4.6 0 0 0 19.5 7c.1-.4.5-1.9-.1-3.4 0 0-1-.3-3.5 1.3a12 12 0 0 0-6.4 0C7 3.3 6 3.6 6 3.6 5.4 5.1 5.8 6.6 5.9 7a4.6 4.6 0 0 0-1.2 3.4c0 4.7 2.8 5.7 5.5 6-.4.4-.7 1-.7 2.1V22"/></svg></a>
    </nav>
  </header>
  <div data-view="editor">
  <main>

    <div class="workspace">
      <section class="editor-panel" aria-labelledby="editor-title">
        <div class="panel-heading">
          <h2 id="editor-title">Markdown</h2>
          <div class="panel-actions">
          </div>
        </div>
        <label class="sr-only" for="markdown">Markdown 正文</label>
        <textarea id="markdown" spellcheck="false" placeholder="正在加载示例…"></textarea>
        <div class="editor-footer"><span><math aria-label="即时预览"><mrow><munder><mo>lim</mo><mrow><mi>Δt</mi><mo lspace="0.08em" rspace="0.08em">→</mo><msup><mn>0</mn><mo>+</mo></msup></mrow></munder><mtext>Preview</mtext><mo stretchy="false">(</mo><mi>t</mi><mo>+</mo><mi>Δt</mi><mo stretchy="false">)</mo><mo>=</mo><mi mathvariant="normal">render</mi><mo stretchy="false">(</mo><mtext>Markdown</mtext><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo stretchy="false">)</mo></mrow></math></span><span id="count">0 字符</span></div>
      </section>
      <section class="preview-panel" aria-labelledby="preview-title">
        <div class="panel-heading">
          <h2 id="preview-title">预览 <span id="current-template" aria-live="polite"></span></h2>
          <div class="panel-actions">
            <button id="download" class="icon-button panel-download" type="button" aria-label="下载 PDF" title="下载 PDF" disabled>
              <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M5 12v-7a2 2 0 0 1 2 -2h7l5 5v4"/><path d="M5 18h1.5a1.5 1.5 0 0 0 0 -3h-1.5v6"/><path d="M17 18h2"/><path d="M20 15h-3v6"/><path d="M11 15v6h1a2 2 0 0 0 2 -2v-2a2 2 0 0 0 -2 -2h-1"/></svg>
              <span class="btn-label sr-only">下载 PDF</span>
            </button>
          </div>
        </div>
    <form id="options" class="toolbar preview-toolbar" aria-label="预览排版选项">
      <div class="toolbar-field" data-control="type"><details class="range-pop"><summary class="range-trigger" data-option-trigger="type" aria-haspopup="menu" aria-label="模板"><svg class="preview-option-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3h10l4 4v14H4z"/><path d="M14 3v5h5M7 12h8M7 16h6"/></svg></summary><select hidden aria-label="模板" name="type"><option value="">自动识别</option><option value="general">通用文档</option><option value="skill">技能文档</option><option value="paper">学术论文</option><option value="gb">国家标准</option></select><div class="range-popover option-popover" data-option-menu="type" role="menu" aria-label="模板"></div></details></div>
      <div class="toolbar-field" data-control="theme"><details class="range-pop"><summary class="range-trigger" data-option-trigger="theme" aria-haspopup="menu" aria-label="主题"><svg class="preview-option-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18h1a2 2 0 0 0 0-4h-1a1 1 0 0 1 0-2h3a6 6 0 0 0 6-6c0-4-5-6-9-6z"/><path d="M7 9h.01M11 6h.01M16 7h.01M6 14h.01"/></svg></summary><select hidden aria-label="主题" name="theme"><option value="">跟随文档</option><option value="elegant">雅致 · 墨蓝</option><option value="minimal">简洁 · 黑白</option><option value="gb">国家标准</option></select><div class="range-popover option-popover" data-option-menu="theme" role="menu" aria-label="主题"></div></details></div>
      <div class="toolbar-field" data-control="toc"><details class="range-pop"><summary class="range-trigger" data-option-trigger="toc" aria-haspopup="menu" aria-label="目录"><svg class="preview-option-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg></summary><select hidden aria-label="目录" name="toc"><option value="">跟随文档</option><option value="false">隐藏目录</option><option value="1">一级目录</option><option value="2">二级目录</option></select><div class="range-popover option-popover" data-option-menu="toc" role="menu" aria-label="目录"></div></details></div>
      <div class="toolbar-field" data-control="numbering"><details class="range-pop"><summary class="range-trigger" data-option-trigger="numbering" aria-haspopup="menu" aria-label="编号"><svg class="preview-option-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 6h10M10 12h10M10 18h10M4 3v5M3 4l1-1M3 11c3-2 4 0 1 3l-1 1h3M3 18h2l-1 2h1c2 2-1 3-2 2"/></svg></summary><select hidden aria-label="编号" name="numbering"><option value="">跟随文档</option><option value="none">不加编号</option><option value="auto">自动编号</option><option value="force:arabic">数字编号</option><option value="force:cjk">中文编号</option><option value="force:chapter">章节编号</option></select><div class="range-popover option-popover" data-option-menu="numbering" role="menu" aria-label="编号"></div></details></div>
      <div class="toolbar-field" data-control="fontSize"><details class="range-pop"><summary class="range-trigger" data-range-trigger="fontSize" aria-label="字号：跟随文档"><svg class="preview-option-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19 9 4l6 15M5 14h8M16 11h6M19 8v11"/></svg></summary><div class="range-popover"><div class="option-label">字号</div><div class="ruler-control"><output class="range-value" data-range-value="fontSize" aria-hidden="true"></output><input type="range" class="range-slider ruler-slider" data-range-slider="fontSize" min="8" max="24" step="0.5" aria-label="字号滑块"><button type="button" class="range-default" data-range-default="fontSize" aria-label="恢复默认字号" title="恢复默认字号"><svg class="range-default-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg></button></div><div class="ruler-scale" data-range-scale="fontSize" aria-hidden="true"><span class="ruler-label ruler-label--min">8</span><span class="ruler-label ruler-label--max">24</span></div><input name="fontSize" data-range-number="fontSize" type="hidden" value=""></div></details></div>
      <div class="toolbar-field" data-control="margin"><details class="range-pop"><summary class="range-trigger" data-range-trigger="margin" aria-label="页边距：跟随文档"><svg class="preview-option-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M8 3v18M16 3v18M4 7h16M4 17h16"/></svg></summary><div class="range-popover"><div class="option-label">边距</div><div class="ruler-control"><output class="range-value" data-range-value="margin" aria-hidden="true"></output><input type="range" class="range-slider ruler-slider" data-range-slider="margin" min="10" max="40" step="1" aria-label="页边距滑块"><button type="button" class="range-default" data-range-default="margin" aria-label="恢复默认页边距" title="恢复默认页边距"><svg class="range-default-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg></button></div><div class="ruler-scale" data-range-scale="margin" aria-hidden="true"><span class="ruler-label ruler-label--min">10</span><span class="ruler-label ruler-label--max">40</span></div><input name="margin" data-range-number="margin" type="hidden" value=""></div></details></div>
      <div class="toolbar-field" data-control="lineHeight"><details class="range-pop"><summary class="range-trigger" data-range-trigger="lineHeight" aria-label="行距：跟随文档"><svg class="preview-option-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5h11M10 12h11M10 19h11M4 3v18M1 6l3-3 3 3M1 18l3 3 3-3"/></svg></summary><div class="range-popover"><div class="option-label">行距</div><div class="ruler-control"><output class="range-value" data-range-value="lineHeight" aria-hidden="true"></output><input type="range" class="range-slider ruler-slider" data-range-slider="lineHeight" min="1" max="2.5" step="0.05" aria-label="行距滑块"><button type="button" class="range-default" data-range-default="lineHeight" aria-label="恢复默认行距" title="恢复默认行距"><svg class="range-default-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg></button></div><div class="ruler-scale" data-range-scale="lineHeight" aria-hidden="true"><span class="ruler-label ruler-label--min">1</span><span class="ruler-label ruler-label--max">2.5</span></div><input name="lineHeight" data-range-number="lineHeight" type="hidden" value=""></div></details></div>
    </form>
        <div id="config-errors" class="config-errors" role="alert" aria-live="assertive" hidden>
          <p class="config-errors-title">配置无效</p>
          <ul class="config-errors-list"></ul>
        </div>
        <div class="preview-surface"><iframe id="preview" title="Markdown 排版预览" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe><div id="empty-preview">在左侧开始书写，预览将在这里呈现。</div></div>
        <div class="preview-footer"><span><math aria-label="持续改进预览与 PDF 一致性"><mrow><munder><mo>lim</mo><mrow><mtext>effort</mtext><mo lspace="0.08em" rspace="0.08em">→</mo><mo lspace="0" rspace="0">+</mo><mo lspace="0" rspace="0">∞</mo></mrow></munder><mtext>Preview</mtext><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>=</mo><mtext>PDF</mtext><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo></mrow></math></span><p id="status" role="status" aria-live="polite">正在加载示例…</p></div>
      </section>
    </div>
    <p class="privacy">服务器不保存用户数据，仅暂存于当前标签页，请及时<button id="privacy-save" type="button" aria-label="下载保存 Markdown">下载保存</button> Markdown。</p>
  </main>
  </div>
  <div class="template-library-page" hidden>
    <div data-view="templates" class="template-library-view">
      <main class="examples-main">
        <div class="examples-heading"><h2>模板</h2><p class="examples-intro">浏览模板效果，选择后可直接从该模板创建。</p><span id="list-status" role="status" aria-live="polite">正在加载…</span></div>
        <ul id="example-list" class="example-cards" role="list" aria-busy="true"></ul>
      </main>
    </div>
  </div>
</body>
</html>
