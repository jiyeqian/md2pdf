<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>md2pdf</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/editor-core.css">
  <link rel="stylesheet" href="/editor-images.css">
  <link rel="stylesheet" href="/editor-pro.css">
  <link rel="stylesheet" href="/editor-workspace.css">
  <link rel="stylesheet" href="/editor-doi.css">
  <script src="/editor-vendor.js" defer></script>
  <script src="/editor-core.js" defer></script>
  <script src="/editor-images.js" defer></script>
  <script src="/editor-pro.js" type="module"></script>
  <script src="/editor-workspace.js" defer></script>
  <script src="/editor-doi.js" type="module"></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-icon" aria-hidden="true">M↓</span><div class="brand-text"><h1 class="brand-logo">md2pdf</h1><p class="brand-sub">MAKE MD2PDF GREAT</p></div></div>
    <nav class="topbar-actions" aria-label="页面导航">
      <a id="examples-link-top" class="button-link" href="/examples">示例库</a>
      <a class="button-link" href="https://github.com/jiyeqian/md2pdf" target="_blank" rel="noopener noreferrer" aria-label="md2pdf GitHub 仓库">GitHub</a>
    </nav>
  </header>
  <main>
    <form id="options" class="toolbar" aria-label="排版选项">
      <label>文档类型<select name="type"><option value="">自动识别</option><option value="general">通用文档</option><option value="readme">README</option><option value="skill">技能文档</option><option value="paper">论文</option><option value="gb">国家标准</option></select></label>
      <label data-control="theme">主题<select name="theme"><option value="">跟随文档</option><option value="elegant">雅致 · 墨蓝</option><option value="minimal">简洁 · 黑白</option><option value="gb">国家标准</option></select></label>
      <label data-control="toc">目录<select name="toc"><option value="">跟随文档</option><option value="true">显示</option><option value="false">隐藏</option></select></label>
      <label data-control="fontSize">字号 / pt<input name="fontSize" type="number" min="8" max="24" step="0.5" placeholder="默认"></label>
      <label data-control="margin">边距 / mm<select name="margin"><option value="">跟随文档</option><option value="15">15 · 紧凑</option><option value="20">20 · 标准</option><option value="25">25 · 宽松</option></select></label>
      <label data-control="numbering">章节编号<select name="numbering"><option value="">跟随文档</option><option value="auto">自动识别</option><option value="force">强制编号</option><option value="none">不编号</option></select></label>
      <label data-control="numberScheme">编号方案<select name="numberScheme"><option value="">跟随文档</option><option value="arabic">1 / 1.1</option><option value="cjk">一、/（一）</option><option value="chapter">第 1 章</option><option value="gb">GB 章条</option></select></label>
    </form>
    <div class="workspace">
      <section class="editor-panel" aria-labelledby="editor-title">
        <div class="panel-heading">
          <h2 id="editor-title">Markdown</h2>
          <div class="panel-actions">
            <span id="count">0 字符</span>
          </div>
        </div>
        <label class="sr-only" for="markdown">Markdown 正文</label>
        <textarea id="markdown" spellcheck="false" placeholder="正在加载示例…"></textarea>
        <div class="editor-footer"><span>输入后自动更新预览</span><a id="browse-examples" class="button-link button-link--small" href="/examples">浏览示例库</a></div>
      </section>
      <section class="preview-panel" aria-labelledby="preview-title">
        <div class="panel-heading">
          <h2 id="preview-title">排版预览</h2>
          <div class="panel-actions">
            <button id="download" class="icon-button panel-download" type="button" aria-label="下载 PDF" title="下载 PDF" disabled>
              <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M5 12v-7a2 2 0 0 1 2 -2h7l5 5v4"/><path d="M5 18h1.5a1.5 1.5 0 0 0 0 -3h-1.5v6"/><path d="M17 18h2"/><path d="M20 15h-3v6"/><path d="M11 15v6h1a2 2 0 0 0 2 -2v-2a2 2 0 0 0 -2 -2h-1"/></svg>
              <span class="btn-label sr-only">下载 PDF</span>
            </button>
          </div>
        </div>
        <div class="preview-surface"><iframe id="preview" title="Markdown 排版预览" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe><div id="empty-preview">在左侧开始书写，预览将在这里呈现。</div></div>
      </section>
    </div>
    <div class="status-row"><p id="status" role="status" aria-live="polite">正在加载示例…</p><span>预览分页与 PDF 可能略有差异</span></div>
    <p class="privacy">正文发送至服务器进行排版，服务器不保存正文或编辑历史。草稿与选项仅保存在当前浏览器会话（sessionStorage）中；浏览示例库或刷新页面后草稿会恢复。支持内嵌 PNG / JPEG / GIF / WebP 图片；本机路径和远程图片显示为未加载占位。</p>
  </main>
</body>
</html>
