# CNB 云原生构建（cnb.cool）
#
# 定位：发布前校验 + 打标签时发布到 npm。
# 构建节点是 Linux 容器，没有 macOS、也不装 Chrome —— 所以 CI 不打印 PDF，
# 渲染校验落在 HTML 阶段（--html-only）。真实 PDF 打印属于本机环节。
# 发布到 npm 需要项目里配置 NPM_TOKEN secret（npmjs 的 automation token）。

$:
  push:
    - name: 校验
      env:
        LANG: C.UTF-8
      stages:
        - name: 环境信息
          script: |
            grep PRETTY_NAME /etc/os-release || true
            echo "bash: $(command -v bash || echo 缺失)"
            echo "git : $(git --version 2>/dev/null || echo 缺失)"
            echo "node: $(node -v 2>/dev/null || echo '未预装，校验脚本会自动安装')"
        - name: 运行校验
          script: |
            bash ci/validate.sh

  pull_request:
    - name: 校验
      env:
        LANG: C.UTF-8
      stages:
        - name: 运行校验
          script: |
            bash ci/validate.sh

  tag_push:
    - name: 发布
      env:
        LANG: C.UTF-8
        NPM_TOKEN: ${NPM_TOKEN}
      stages:
        - name: 发布前校验
          script: |
            bash ci/validate.sh
        - name: 发布到 npm
          script: |
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
            npm publish --access public
