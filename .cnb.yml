# CNB 云原生构建（cnb.cool）
#
# 定位：发布前校验 + main/版本标签同步到 GitHub + 打标签时发布到 npm。
# 构建节点是 Linux 容器，没有 macOS、也不装 Chrome —— 所以 CI 不打印 PDF，
# 渲染校验落在 HTML 阶段（--html-only）。真实 PDF 打印属于本机环节。
# 发布到 npm：用 node:22 镜像（自带 npm），通过 imports 引用密钥仓库 secrets 里的 npm.yml（含 NPM_TOKEN）。

# 使用 glob 匹配，保证 main 的独立同步任务不会屏蔽原有流水线。
"**":
  push:
    - name: 校验
      docker:
        image: node:22
      env:
        LANG: C.UTF-8
      stages:
        - name: 环境信息
          script: |
            grep PRETTY_NAME /etc/os-release || true
            echo "bash: $(command -v bash || echo 缺失)"
            echo "git : $(git --version 2>/dev/null || echo 缺失)"
            echo "node: $(node -v 2>/dev/null || echo '未预装，校验脚本会自动安装')"
        - name: 运行校验
          script: |
            bash scripts/validate.sh

  pull_request:
    - name: 校验
      docker:
        image: node:22
      env:
        LANG: C.UTF-8
      stages:
        - name: 运行校验
          script: |
            bash scripts/validate.sh

  tag_push:
    - name: 同步版本标签到 GitHub
      lock:
        key: github-md2pdf-sync
        wait: true
        timeout: 600
      stages:
        - name: 推送本次版本标签
          image: tencentcom/git-sync
          imports:
            - https://cnb.cool/jiyeqian/secrets/-/blob/main/github-md2pdf.yml
          settings:
            target_url: https://github.com/jiyeqian/md2pdf.git
            auth_type: https
            username: ${GITHUB_SYNC_USERNAME}
            password: ${GITHUB_SYNC_TOKEN}
            # branch 仅接受分支名；标签通过 push_tags 推送。限定 main，避免同步其他分支。
            branch: main
            force: false
            push_tags: true
    - name: 发布
      docker:
        image: node:22
      env:
        LANG: C.UTF-8
      imports: https://cnb.cool/jiyeqian/secrets/-/blob/main/npm.yml
      stages:
        - name: 发布前校验
          script: |
            bash scripts/validate.sh
        - name: 发布到 npm
          script: |
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
            npm publish --access public
    - name: 构建静态镜像
      lock:
        key: docker-md2pdf-release
        wait: true
        timeout: 3600
      # 用 DinD 构建静态版镜像并推送到 cnb 自带 Docker 制品库（同名镜像：仓库路径）。
      # 推送到本仓库自己的制品库由流水线自动鉴权，无需显式 docker login。
      services:
        - docker
      stages:
        - name: build & push
          script: |
            set -eu
            # 确保 git 可用（cnb 默认构建镜像未必含 git）
            if ! command -v git >/dev/null 2>&1; then
              (command -v apt-get >/dev/null && apt-get update -qq && apt-get install -y -qq git) || (command -v apk >/dev/null && apk add --no-cache git) || true
            fi
            # 仅发布稳定版本标签，且标签须匹配 package.json。
            TAG=${CNB_BRANCH:?missing tag}
            printf '%s\n' "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' || { echo "Skipping non-release tag: $TAG"; exit 0; }
            VERSION=$(sed -n 's/^[[:space:]]*"version":[[:space:]]*"\([^"]*\)".*/\1/p' package.json | head -1)
            [ "v$VERSION" = "$TAG" ] || { echo "Version does not match $TAG"; exit 1; }
            IMG=${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${TAG}
            LATEST=${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest

            # 多架构支持：注册 QEMU 模拟器 + 创建 buildx 构建器（amd64 + arm64）
            docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
            docker buildx create --name multiarch --driver docker-container --use 2>/dev/null \
              || docker buildx use multiarch 2>/dev/null || true
            docker buildx inspect --bootstrap

            # 同时构建并推送 amd64 + arm64（--push 直接推送到制品库，无需本地 tag）
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              -t $IMG \
              --push .
            if sh scripts/docker-latest.sh "$TAG" origin; then
              docker buildx imagetools create -t "$LATEST" "$IMG"
            else
              result=$?
              [ "$result" -eq 1 ] || exit "$result"
              echo "Not the latest stable tag: $TAG"
            fi

main:
  push:
    - name: 同步到 GitHub
      lock:
        key: github-md2pdf-sync
        wait: true
        timeout: 600
      stages:
        - name: 推送 main
          image: tencentcom/git-sync
          imports:
            - https://cnb.cool/jiyeqian/secrets/-/blob/main/github-md2pdf.yml
          settings:
            target_url: https://github.com/jiyeqian/md2pdf.git
            auth_type: https
            username: ${GITHUB_SYNC_USERNAME}
            password: ${GITHUB_SYNC_TOKEN}
            branch: main
            force: false
            # main 推送时也补齐标签，避免 tag_push 的单标签同步失败后长期遗漏。
            push_tags: true
