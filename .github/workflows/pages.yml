name: Publish static WebApp

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify release version
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { version } = JSON.parse(readFileSync("package.json", "utf8"));
            if (process.env.GITHUB_REF_NAME !== `v${version}`) {
              throw new Error("Tag must match package.json version");
            }
          '
      - uses: actions/configure-pages@v5
      - name: Check runtime consistency and build static WebApp
        run: npm run check:consistency
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/static
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
