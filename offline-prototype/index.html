<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#233e60">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./prototype.css">
<title>md2pdf · 完整离线原型</title>
</head>
<body>
<header><h1>md2pdf · 完整离线原型</h1><p>浏览器本地排版 · 与桌面版共用渲染源码</p></header>
<nav aria-label="文档操作">
<label>示例 <select id="example"><option value="general">通用文档</option><option value="paper">学术论文</option><option value="gb">国家标准</option><option value="skill">技能文档</option><option value="long-table">长表格压力样例</option></select></label>
<button id="load">载入示例</button><label class="file">打开 Markdown<input id="file" type="file" accept=".md,.markdown,text/markdown,text/plain"></label>
<button id="save">下载 Markdown</button><button id="render">更新离线预览</button><button id="print" disabled>① 打印／另存为 PDF</button><button id="outline" disabled>② 选择 PDF 并补全大纲…</button><input id="outline-file" type="file" accept=".pdf,application/pdf" hidden>
</nav>
<p class="notice">这是独立验证原型。PDF 通过系统打印面板保存，不等同于桌面版的一键下载。完整保存当前文档后，选择刚保存的 PDF 补全大纲（不上传）。打印时使用预览纸张、100% 缩放，关闭浏览器附加页眉页脚。中文字体及 iPhone 排版仍待验证。</p>
<p id="cache" role="status">正在准备离线资源…</p>
<main><section><label for="source">Markdown 正文（停笔后自动保存，点击按钮更新预览）</label><textarea id="source" spellcheck="false"></textarea><p id="saved" role="status"></p></section><section><p id="status" role="status"></p><iframe id="preview" title="离线分页预览" sandbox="allow-scripts allow-same-origin allow-modals"></iframe></section></main>
<script>
addEventListener('error', event => { const node = document.querySelector('#status'); node.textContent = '启动失败：' + event.message; node.dataset.error = 'true'; });
addEventListener('unhandledrejection', event => { const node = document.querySelector('#status'); node.textContent = '启动失败：' + (event.reason?.message || String(event.reason)); node.dataset.error = 'true'; });
</script>
<script>
import('./prototype.mjs').catch(error => { document.querySelector('#status').textContent = '模块启动失败：' + error.message; });
</script>
</body></html>
